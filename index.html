document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Work Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"13ddfa00-f63c-4200-8f08-06102bf122d2\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Work Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"d40f3c46-4eaf-4ba3-9497-91090c59ea29\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Work Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"1560942b-254f-490c-9ee1-02e5501819ba\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Work Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"13ddfa00-f63c-4200-8f08-06102bf122d2\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Work Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"d40f3c46-4eaf-4ba3-9497-91090c59ea29\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Work Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"1560942b-254f-490c-9ee1-02e5501819ba\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>body{margin:0;background:#F6F9FD;-webkit-font-smoothing:antialiased;} *{box-sizing:border-box;} a{color:#12356B;} a:hover{color:#0B2149;} button{font:inherit;}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#F6F9FD;font-family:'Work Sans',system-ui,sans-serif;color:#374151;\">\n  <header style=\"background:#FFFFFF;border-bottom:1px solid #E6EBF4;position:{{ headerPos }};top:0;z-index:20;\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;\">\n      <div style=\"display:flex;align-items:center;gap:12px;\">\n        <div style=\"width:36px;height:36px;border-radius:10px;background:#12356B;color:#FFFFFF;display:grid;place-items:center;font-family:Poppins,sans-serif;font-weight:800;font-size:13px;letter-spacing:.02em;\">GC<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px;\">\n          <div style=\"font-family:Poppins,sans-serif;font-weight:700;font-size:12px;letter-spacing:.08em;color:#12356B;\">COMUNIDAD DE GESTIÓN DEL CAMBIO<\u002Fdiv>\n          <div style=\"font-size:12px;color:#64748B;\">Simulador de resistencia al cambio<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showSteps }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;\">\n          <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:10px;\">\n              <sc-if value=\"{{ st.line }}\"><div style=\"width:20px;height:2px;background:{{ st.lineBg }};border-radius:2px;transition:background .4s;\"><\u002Fdiv><\u002Fsc-if>\n              <div style=\"display:flex;align-items:center;gap:8px;\">\n                <div style=\"width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:Poppins,sans-serif;font-weight:700;font-size:12px;background:{{ st.dotBg }};color:{{ st.dotColor }};border:2px solid {{ st.dotBorder }};transition:all .4s;\">{{ st.text }}<\u002Fdiv>\n                <sc-if value=\"{{ st.cur }}\"><div style=\"font-size:13px;font-weight:600;color:{{ st.labelColor }};white-space:nowrap;\">{{ st.label }}<\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasProto }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:10px;\">\n          <div style=\"width:34px;height:34px;border-radius:50%;background:#DBE6FB;color:#12356B;display:grid;place-items:center;font-family:Poppins,sans-serif;font-weight:700;font-size:13px;\">{{ protoInitials }}<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:1px;\">\n            <div style=\"font-size:13px;font-weight:600;color:#374151;white-space:nowrap;\">{{ protoName }}<\u002Fdiv>\n            <div style=\"font-size:12px;color:#64748B;\">{{ protoRole }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"max-width:1240px;margin:0 auto;padding:36px clamp(16px,5vw,24px) 96px;\">\n    <sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:120px 0;text-align:center;color:#64748B;font-size:15px;\">Preparando la simulación…<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isError }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:120px 0;text-align:center;color:#12356B;font-size:15px;\">{{ err }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"opacity:{{ enterOpacity }};transform:{{ enterTransform }};transition:{{ enterTransition }};\">\n\n      <sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ true }}\">\n        <section data-screen-label=\"01 Inicio\" style=\"min-height:calc(100vh - 170px);display:flex;flex-direction:column;justify-content:center;gap:48px;\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;\">\n            <span style=\"font-size:13px;font-weight:600;letter-spacing:.1em;color:#64748B;white-space:nowrap;\">SIMULACIÓN INDIVIDUAL<\u002Fspan>\n            <h1 style=\"font-family:Poppins,sans-serif;font-weight:800;font-size:clamp(30px,4.2vw,48px);line-height:1.1;letter-spacing:-.02em;color:#12356B;margin:0;max-width:780px;text-wrap:balance;\">¿Estás gestionando la resistencia… o la estás aumentando?<\u002Fh1>\n            <p style=\"max-width:600px;font-size:18px;line-height:1.6;margin:0;text-wrap:pretty;\">Explora cómo tus decisiones como líder pueden reducir —o intensificar— la resistencia durante un cambio.<\u002Fp>\n            <button sc-camel-on-click=\"{{ start }}\" style=\"white-space:nowrap;margin-top:10px;padding:16px 30px;border-radius:11px;border:none;background:#12356B;color:#FFFFFF;font-family:Poppins,sans-serif;font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 14px 28px -16px rgba(18,53,107,.6);transition:background .2s,transform .2s;\" style-hover=\"background:#0B2149;transform:translateY(-1px);\">Comenzar la simulación →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isProto }}\" hint-placeholder-val=\"{{ false }}\">\n        <section data-screen-label=\"02 Asume el reto\" style=\"display:flex;flex-direction:column;gap:22px;max-width:760px;margin:0 auto;\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;text-align:center;align-items:center;\">\n            <span style=\"font-size:13px;font-weight:600;letter-spacing:.08em;color:#64748B;\">ASUME EL RETO<\u002Fspan>\n            <h2 style=\"font-family:Poppins,sans-serif;font-weight:800;font-size:clamp(28px,4vw,38px);line-height:1.15;color:#12356B;margin:0;letter-spacing:-.01em;text-wrap:balance;padding-bottom:2px;width:100%;\">Tú lideras el cambio<\u002Fh2>\n            <p style=\"margin:0;font-size:16px;line-height:1.55;color:#374151;text-wrap:pretty;\">Ingresa tu nombre para asumir el rol de responsable de Operaciones.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;max-width:460px;width:100%;margin:0 auto;\">\n            <label for=\"proto-name\" style=\"font-size:12px;font-weight:600;letter-spacing:.08em;color:#64748B;\">TU NOMBRE EN LA SIMULACIÓN<\u002Flabel>\n            <input id=\"proto-name\" type=\"text\" maxlength=\"40\" autocomplete=\"off\" autocorrect=\"off\" spellcheck=\"false\" name=\"sim-participante\" data-lpignore=\"true\" data-1p-ignore=\"true\" placeholder=\"Escribe tu nombre\" value=\"{{ protoInput }}\" sc-camel-on-change=\"{{ onProtoInput }}\" sc-camel-on-key-down=\"{{ onProtoKey }}\" style=\"box-sizing:border-box;width:100%;padding:14px 16px;border:1.5px solid #C9D3E3;border-radius:10px;background:#FFFFFF;font-family:inherit;font-size:17px;color:#12356B;outline:none;box-shadow:inset 0 1px 2px rgba(18,53,107,.06);transition:border-color .2s,box-shadow .2s;\" style-focus=\"border-color:#12356B;box-shadow:0 0 0 3px rgba(18,53,107,.14);\">\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E6EBF4;border-radius:15px;padding:clamp(18px,4vw,24px);box-shadow:0 10px 24px -18px rgba(18,53,107,0.16);display:flex;flex-direction:column;gap:18px;\">\n            <div style=\"display:flex;flex-direction:column;gap:10px;\">\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.08em;color:#64748B;\">TU CONTEXTO EN EL CASO<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px;\">\n                <div style=\"background:#F6F9FD;border-radius:10px;padding:10px 14px;font-size:15px;line-height:1.35;color:#64748B;\"><strong style=\"font-family:Poppins,sans-serif;font-weight:700;font-size:17px;color:#12356B;\">{{ spOrg }} años<\u002Fstrong> · en la organización<\u002Fdiv>\n                <div style=\"background:#F6F9FD;border-radius:10px;padding:10px 14px;font-size:15px;line-height:1.35;color:#64748B;\"><strong style=\"font-family:Poppins,sans-serif;font-weight:700;font-size:17px;color:#12356B;\">{{ spCargo }} años<\u002Fstrong> · en el cargo<\u002Fdiv>\n                <div style=\"background:#F6F9FD;border-radius:10px;padding:10px 14px;font-size:15px;line-height:1.35;color:#64748B;\"><strong style=\"font-family:Poppins,sans-serif;font-weight:700;font-size:17px;color:#12356B;\">{{ spPersonas }} personas<\u002Fstrong> · a cargo<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:18px;border-top:1px solid #E6EBF4;\">\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.08em;color:#64748B;\">EL CAMBIO QUE DEBES LIDERAR<\u002Fdiv>\n              <p style=\"margin:0;font-size:16px;line-height:1.6;color:#374151;text-wrap:pretty;\">La organización se prepara para implementar un nuevo proceso digital que modificará parte de la forma habitual de trabajar. La preparación ya ha comenzado: el equipo debe familiarizarse con la nueva forma de trabajo y realizar prácticas mientras la operación continúa funcionando.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;padding-top:18px;border-top:1px solid #E6EBF4;\">\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.08em;color:#64748B;\">TU PUNTO DE PARTIDA<\u002Fdiv>\n              <p style=\"margin:0;font-family:Poppins,sans-serif;font-weight:700;font-size:20px;line-height:1.3;color:#12356B;text-wrap:balance;\">Día 2 · Quedan 8 días para el lanzamiento<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:center;\">\n            <button sc-camel-on-click=\"{{ confirmProto }}\" disabled=\"{{ protoDisabled }}\" style=\"white-space:nowrap;padding:16px 30px;border-radius:11px;border:none;background:#12356B;color:#FFFFFF;font-family:Poppins,sans-serif;font-weight:600;font-size:16px;cursor:{{ protoCursor }};opacity:{{ protoBtnOpacity }};transition:background .2s,opacity .2s;\" style-hover=\"background:#0B2149;\">Entrar al Día 2 →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isPlay }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;max-width:1080px;margin:0 auto;\">\n          <div style=\"flex:1 1 460px;min-width:0;display:flex;flex-direction:column;gap:24px;\">\n\n            <sc-if value=\"{{ isSituation }}\">\n              <section data-screen-label=\"Situación\" style=\"display:flex;flex-direction:column;gap:24px;max-width:720px;width:100%;margin:0 auto;\">\n                <sc-if value=\"{{ hasDay }}\">\n                  <div style=\"background:#FFFFFF;border:1px solid #E6EBF4;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;\">\n                    <div style=\"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;\">\n                      <span style=\"font-family:Poppins,sans-serif;font-weight:700;color:#12356B;\">{{ dayText }}<\u002Fspan>\n                      <span style=\"color:#64748B;font-weight:600;\">{{ faltanText }} para el lanzamiento<\u002Fspan>\n                    <\u002Fdiv>\n p:1px solid #F0F3F8;\">\n                    <span style=\"font-size:16px;line-height:1.4;color:#374151;\">{{ ri.label }}<\u002Fspan>\n                    <span style=\"display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:99px;background:{{ ri.bg }};color:{{ ri.color }};font-size:14px;font-weight:600;white-space:nowrap;\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ ri.color }};\"><\u002Fspan>{{ ri.state }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;padding:36px 0;border-top:1px solid #E6EBF4;\">\n              <h2 style=\"margin:0;font-family:Poppins,sans-serif;font-weight:600;font-size:18px;color:#12356B;\">{{ rpTensionHeading }}<\u002Fh2>\n              <p style=\"margin:0;font-family:Poppins,sans-serif;font-weight:600;font-size:17px;line-height:1.45;color:#0B2149;text-wrap:pretty;\">{{ rpTensionTitle }}<\u002Fp>\n              <sc-if value=\"{{ rpHasTensionText }}\"><p style=\"margin:0;font-size:16px;line-height:1.7;color:#374151;text-wrap:pretty;\">{{ rpTensionText }}<\u002Fp><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;padding-top:36px;border-top:1px solid #E6EBF4;\">\n              <h2 style=\"margin:0;font-family:Poppins,sans-serif;font-weight:600;font-size:18px;color:#12356B;\">03 · Qué puedes llevar a tu próxima gestión<\u002Fh2>\n              <p style=\"margin:0;font-family:Poppins,sans-serif;font-weight:600;font-size:17px;line-height:1.45;color:#0B2149;text-wrap:pretty;\">{{ rpNextStep }}<\u002Fp>\n              <sc-if value=\"{{ rpHasNextStepText }}\"><p style=\"margin:0;font-size:16px;line-height:1.7;color:#374151;text-wrap:pretty;\">{{ rpNextStepText }}<\u002Fp><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Farticle>\n          <div style=\"display:flex;justify-content:center;\">\n            <button sc-camel-on-click=\"{{ restart }}\" style=\"white-space:nowrap;padding:14px 26px;border-radius:11px;border:1.5px solid #12356B;background:#FFFFFF;color:#12356B;font-family:Poppins,sans-serif;font-weight:600;font-size:15px;cursor:pointer;transition:background .2s;\" style-hover=\"background:#DBE6FB;\">Volver a jugar<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;hudBeforeDecision&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Experiencia&quot;},&quot;showDebrief&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Experiencia&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Suave&quot;,&quot;Ninguna&quot;],&quot;default&quot;:&quot;Suave&quot;,&quot;tsType&quot;:&quot;'Suave' | 'Ninguna'&quot;,&quot;section&quot;:&quot;Experiencia&quot;}}\">\nclass Component extends DCLogic {\n  state = { cfg: null, err: null, screen: 'intro', proto: null, ri: 0, sel: null, decisions: {}, vals: {}, disp: {}, history: [], lastDelta: {}, entered: true, showSources: false };\n  KEY = 'dc-sim-resistencia-o-aumento-001';\n\n  componentDidMount() {\n    this.onResize = () => { const n = window.innerWidth < 720; if (n !== this.state.narrow) this.setState({ narrow: n }); };\n    this.onResize(); window.addEventListener('resize', this.onResize);\n    Promise.all([\n      fetch((window.__resources && window.__resources.cfgJson) || 'uploads/resistencia-o-aumento-001_v1.1_DRAFT.json').then(r => { if (!r.ok) throw new Error('No se pudo cargar la configuración del simulador.'); return r.json(); }),\n      import((window.__resources && window.__resources.reportLogic) || './report-logic.js')\n    ])\n      .then(([cfg, RL]) => {\n        this.RL = RL;\n        const init = this.init(cfg);\n        let saved = null;\n        try { saved = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) {}\n        if (saved && saved.id === cfg.metadata.simulatorId && saved.v === cfg.metadata.configVersion && saved.s) this.setState({ cfg, ...saved.s, screen: saved.s.screen === 'round' ? 'situation' : saved.s.screen, disp: saved.s.vals });\n        else this.setState({ cfg, vals: init, disp: init, history: [init] });\n        try { window.__reportQA = RL.runQA(cfg); } catch (e) {}\n      })\n      .catch(e => this.setState({ err: e.message }));\n  }\n  componentWillUnmount() { cancelAnimationFrame(this.raf); clearTimeout(this.tt); window.removeEventListener('resize', this.onResize); }\n  init(cfg) { const o = {}; cfg.indicators.forEach(i => (o[i.id] = i.initial)); return o; }\n  motion() { return (this.props.motion ?? 'Suave') !== 'Ninguna'; }\n  persist() {\n    const s = this.state; if (!s.cfg) return;\n    const { screen, proto, ri, sel, decisions, vals, history, lastDelta } = s;\n    try { localStorage.setItem(this.KEY, JSON.stringify({ id: s.cfg.metadata.simulatorId, v: s.cfg.metadata.configVersion, s: { screen, proto, ri, sel, decisions, vals, history, lastDelta } })); } catch (e) {}\n  }\n  go(screen, extra) {\n    this.setState({ ...(extra || {}), screen, entered: false }, () => {\n      try { window.scrollTo({ top: 0, behavior: this.motion() ? 'smooth' : 'auto' }); } catch (e) {}\n      this.persist();\n      clearTimeout(this.et);\n      this.et = setTimeout(() => this.setState({ entered: true }), 40);\n    });\n  }\n  sit() { return this.state.cfg.rounds[this.state.ri].situations[0]; }\n  split(t) { const i = t.indexOf(':'); return i < 0 ? { title: t, body: '' } : { title: t.slice(0, i), body: t.slice(i + 1).trim() }; }\n  confirm() {\n    const { cfg, sel, vals, decisions, history } = this.state; if (!sel) return;\n    const s = this.sit(); const op = s.options.find(o => o.id === sel);\n    const nv = { ...vals }, d = {};\n    cfg.indicators.forEach(i => { const v = Math.max(i.min, Math.min(i.max, vals[i.id] + (op.effects[i.id] || 0))); nv[i.id] = v; d[i.id] = v - vals[i.id]; });\n    this.go('consequence', { vals: nv, lastDelta: d, decisions: { ...decisions, [s.id]: op.id }, history: [...history, nv], disp: vals });\n    clearTimeout(this.tt);\n    this.tt = setTimeout(() => this.tween(vals, nv), this.motion() ? 450 : 0);\n  }\n  tween(a, b) {\n    cancelAnimationFrame(this.raf);\n    if (!this.motion()) { this.setState({ disp: b }); return; }\n    const t0 = performance.now(), D = 1100;\n    const step = now => {\n      const t = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - t, 3), o = {};\n      Object.keys(b).forEach(k => (o[k] = Math.round(a[k] + (b[k] - a[k]) * e)));\n      this.setState({ disp: o });\n      if (t < 1) this.raf = requestAnimationFrame(step);\n    };\n    this.raf = requestAnimationFrame(step);\n  }\n  next() { const { cfg, ri } = this.state; if (ri < cfg.rounds.length - 1) this.go('situation', { ri: ri + 1, sel: null }); else this.go('report'); }\n  restart() {\n    const init = this.init(this.state.cfg);\n    try { localStorage.removeItem(this.KEY); } catch (e) {}\n    this.go('intro', { proto: null, ri: 0, sel: null, decisions: {}, vals: init, disp: init, history: [init], lastDelta: {}, showSources: false });\n  }\n  delta(d, ind) {\n    const risk = ind && ind.id === 'riesgo_cronograma';\n    const G = { bg: '#E4F3EA', color: '#1F6B45' }, A = { bg: '#FCEFD9', color: '#8A5205' };\n    if (d > 0) return risk ? { text: '↑ Aumenta el riesgo', ...A } : { text: '↑ Mejora', ...G };\n    if (d < 0) return risk ? { text: '↓ Disminuye el riesgo', ...G } : { text: '↓ Disminuye', ...A };\n    return { text: '→ Sin cambio', bg: '#EEF2F7', color: '#64748B' };\n  }\n  chip(ind, d) {\n    if (d === 0) return { text: 'Sin cambio', bg: '#F6F9FD', color: '#64748B', border: '#E6EBF4' };\n    const fav = ind.direction === 'lower-is-better' ? d < 0 : d > 0;\n    const t = (d > 0 ? '+' : '') + d;\n    return fav ? { text: t + ' · Favorable', bg: '#12356B', color: '#FFFFFF', border: '#12356B' } : { text: t + ' · Desfavorable', bg: '#FFFFFF', color: '#12356B', border: '#12356B' };\n  }\n  dirText(ind) { return ind.direction === 'lower-is-better' ? 'Menor es mejor' : 'Mayor es mejor'; }\n\n/*REPORT: lógica en report-logic.js (config v1.1)*/\n  renderVals() {\n    const s = this.state, cfg = s.cfg, N = '#12356B';\n    const mv = this.motion();\n    const out = {\n      headerPos: s.narrow ? 'static' : 'sticky', isLoading: !cfg && !s.err, isError: !!s.err, err: s.err,\n      enterOpacity: s.entered ? 1 : 0, enterTransform: s.entered ? 'translateY(0)' : 'translateY(16px)',\n      enterTransition: mv ? 'opacity .55s ease, transform .6s cubic-bezier(.2,.7,.2,1)' : 'none',\n      isIntro: false, isProto: false, isRound: false, isPlay: false, isSituation: false, isConsequence: false, isReport: false,\n      showSteps: false, hasProto: false, steps: [], introRounds: [], protoOpts: [], hud: [], options: [], ticks: [], contexts: [], rpIndicators: []\n    };\n    if (!cfg) return out;\n    const md = cfg.metadata, sc = s.screen, rounds = cfg.rounds, ext = cfg.runtimeExtensions, labels = ext.trajectoryLabels;\n    Object.assign(out, {\n      isIntro: sc === 'intro', isProto: sc === 'proto', isRound: sc === 'round',\n      isPlay: sc === 'situation' || sc === 'consequence', isSituation: sc === 'situation', isConsequence: sc === 'consequence', isReport: sc === 'report',\n      tema: md.tema, objetivo: md.objetivo, duracion: md.duracionSimuladorMin, participantes: md.participantes, modalidad: md.modalidad, mode: md.mode,\n      introRounds: rounds.map((r, i) => ({ n: i + 1, label: r.label, proposito: r.proposito })),\n      start: () => this.go(ext.protagonistSelection.enabled ? 'proto' : 'situation', { ri: 0, sel: null }),\n      showSteps: ['situation', 'consequence', 'report'].includes(sc)\n    });\n    out.steps = rounds.map((r, i) => {\n      const done = sc === 'report' || i < s.ri || (i === s.ri && sc === 'consequence');\n      const cur = i === s.ri && sc !== 'report';\n      return { cur, line: i > 0, lineBg: i <= s.ri || sc === 'report' ? N : '#E6EBF4', label: (i + 1) + ' de ' + rounds.length, text: done ? '✓' : String(i + 1),\n        dotBg: done ? N : cur ? '#DBE6FB' : '#FFFFFF', dotColor: done ? '#FFFFFF' : N, dotBorder: done || cur ? N : '#E6EBF4', labelColor: done || cur ? N : '#64748B' };\n    });\n\n    const ps = ext.protagonistSelection, sp = ps.sharedProfile;\n    const ini = n => n.split(' ').map(w => w[0]).slice(0, 2).join('');\n    const typed = typeof s.proto === 'string' ? s.proto : '';\n    const nm = typed.trim().replace(/\\s+/g, ' ');\n    const valid = nm.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g, '').length >= 2;\n    const proto = valid ? { name: nm, role: ps.role || 'Responsable de Operaciones' } : null;\n    const confirm = () => { if (proto) this.go('situation', { proto: nm, ri: 0, sel: null }); };\n    Object.assign(out, {\n      hasProto: !!proto && sc !== 'intro' && sc !== 'proto',\n      protoName: proto ? proto.name : '', protoRole: proto ? proto.role : '', protoInitials: proto ? ini(proto.name).toUpperCase() : '',\n      spOrg: sp.antiguedadOrganizacionAnos, spCargo: sp.antiguedadCargoAnos, spPersonas: sp.personasACargo, spDesc: sp.descripcion,\n      protoInput: typed, \n      onProtoInput: e => this.setState({ proto: e.target.value }),\n      onProtoKey: e => { if (e && typeof e.key === 'string' && e.key === 'Enter') confirm(); },\n      protoDisabled: !proto,\n      protoBtnOpacity: proto ? 1 : 0.45, protoCursor: proto ? 'pointer' : 'not-allowed',\n      confirmProto: confirm\n    });\n\n    const round = rounds[s.ri], sit = round.situations[0];\n    const dm = sit.framing.match(/Día \\d+/), fm = sit.framing.match(/Faltan \\d+ días/);\n    const day = dm ? parseInt(dm[0].slice(4)) : 0, falt = fm ? parseInt(fm[0].slice(7)) : 0, total = day + falt;\n    Object.assign(out, {\n      roundN: s.ri + 1, roundTotal: rounds.length, roundLabel: round.label, roundLabelUpper: round.label.toUpperCase(), roundProposito: round.proposito,\n      hasDay: !!(dm && fm), dayText: dm ? dm[0] : '', faltanText: fm ? fm[0] : '',\n      ticks: Array.from({ length: total }, (_, i) => ({ bg: i + 1 < day ? 'rgba(18,53,107,0.35)' : i + 1 === day ? N : '#E6EBF4' })),\n      enterSituation: () => this.go('situation', { sel: null }),\n      sitTitle: sit.title, framing: sit.framing\n    });\n    const fps = sit.framing.includes('\\n') ? sit.framing.split(/\\n+/).map(t => t.trim()).filter(t => t && !/^Día \\d+ · Faltan \\d+ días$/.test(t)) : sit.framing.replace(/^Día \\d+\\.\\s*Faltan \\d+ días\\.\\s*/, '').split(/(?<=[.?!])\\s+(?=[A-ZÁÉÍÓÚÑ¿¡])/).map(t => t.trim()).filter(Boolean);\n    const multi = sit.framing.includes('\\n') && fps.length > 2;\n    Object.assign(out, { framingParas: multi ? fps.slice(0, -1) : fps, framingLast: multi ? fps[fps.length - 1] : '', hasFramingLast: multi });\n    const SCENES = {\n      S1: { fact: 'Seis personas aún no completan las prácticas previstas.', voicesLabel: 'En el equipo empiezan a surgir dudas', voices: ['“¿Para qué sirve realmente este nuevo proceso?”', '“¿Qué va a cambiar en nuestra forma de trabajar?”', '“¿De verdad facilitará la operación?”'], speakers: [{ who: 'Bruno · Operador con experiencia', quote: '“El diseño no refleja suficientemente lo que pasa en la operación diaria.”' }], constraint: 'El cronograma no se mueve.' },\n      S2: { fact: 'Algo más de la mitad del equipo completa correctamente las prácticas.', voicesLabel: 'En el resto del equipo', voices: ['Otras personas repiten errores o abandonan ejercicios.', 'Algunas temen quedar expuestas por equivocarse.', 'Otras señalan que la carga de trabajo les deja poco tiempo.'], speakers: [], constraint: 'La fecha no puede modificarse.' },\n      S3: { fact: 'El nuevo proceso exige una aprobación adicional antes de cerrar determinados casos urgentes.', factNote: 'Ese paso busca aumentar el control.', voices: [], speakers: [{ who: 'Bruno y otros operadores', quote: 'Sostienen que ese paso puede generar retrasos.' }, { who: 'Responsable del proyecto', quote: 'Advierte que modificar el diseño tan cerca del lanzamiento también supone un riesgo.' }], constraint: '' }\n    };\n    const scn = SCENES[sit.id];\n    out.hasScene = !!scn; out.noScene = !scn;\n    out.scene = scn ? { ...scn, hasFactNote: !!scn.factNote, hasVoices: scn.voices.length > 0, hasConstraint: !!scn.constraint } : { speakers: [], voices: [] };\n    const ctx = cfg.conditionalEvents\n      .filter(e => e.effect.situationId === sit.id && e.effect.contextMode === 'prepend' && e.condition.type === 'decision' && e.condition.op === 'selected' && s.decisions[e.condition.ref] === e.condition.value)\n      .sort((a, b) => b.priority - a.priority).map(e => e.effect.contextText);\n    out.contexts = ctx; out.hasContext = ctx.length > 0;\n    out.options = sit.options.map((o, i) => {\n      const on = o.id === s.sel, sp2 = this.split(o.texto);\n      return { letter: String.fromCharCode(65 + i), title: sp2.title, body: sp2.body ? sp2.body.charAt(0).toUpperCase() + sp2.body.slice(1) : '', onClick: () => this.setState({ sel: o.id }, () => this.persist()),\n        bg: on ? '#F6F9FD' : '#FFFFFF', border: on ? N : '#E6EBF4', shadow: on ? '0 18px 34px -22px rgba(18,53,107,.6)' : '0 10px 24px -18px rgba(18,53,107,0.16)',\n        letterBg: on ? N : '#DBE6FB', letterColor: on ? '#FFFFFF' : N };\n    });\n    Object.assign(out, { confirm: () => this.confirm(), hasSel: !!s.sel });\n\n    const chosenId = s.decisions[sit.id], chosen = sit.options.find(o => o.id === chosenId);\n    if (chosen) {\n      const c = this.split(chosen.texto);\n      Object.assign(out, { trajLabel: labels[chosen.id], chosenLetter: String.fromCharCode(65 + sit.options.indexOf(chosen)), chosenTitle: c.title, chosenBody: c.body ? c.body.charAt(0).toUpperCase() + c.body.slice(1) : c.body, feedback: chosen.feedback_alumno });\n    }\n    Object.assign(out, {\n      showDebrief: (this.props.showDebrief ?? true) && !!sit.debrief,\n      queEstaba: sit.debrief ? sit.debrief.queEstabaEnJuego : '',\n      paraDiscutir: sit.debrief ? sit.debrief.paraDiscutir.map((t, i) => ({ n: String(i + 1).padStart(2, '0'), text: t })) : [],\n      next: () => this.next(), nextText: s.ri < rounds.length - 1 ? 'Siguiente situación →' : 'Ver informe final →'\n    });\n    const hudOn = this.props.hudBeforeDecision ?? false;\n    out.showHud = sc === 'consequence' || (hudOn && sc === 'situation' && Object.keys(s.lastDelta).length > 0);\n    const hudLabels = { apertura_oposicion: 'Apertura para expresar preocupaciones', capacidad_adaptacion: 'Condiciones para adaptarse', ajuste_operativo: 'Ajuste a la realidad operativa', riesgo_cronograma: 'Riesgo sobre el cronograma' };\n    out.hud = cfg.indicators.map(ind => {\n      const ch = this.delta(s.lastDelta[ind.id] ?? 0, ind);\n      return { label: hudLabels[ind.id] || ind.label, deltaText: ch.text, chipBg: ch.bg, chipColor: ch.color };\n    });\n\n    out.restart = () => this.restart();\n    if (sc === 'report' && this.RL) {\n      const rp = this.RL.buildReport(cfg, s.decisions);\n      const T = { favorable: { bg: '#E4F3EA', color: '#1F6B45' }, unfavorable: { bg: '#FCEFD9', color: '#8A5205' }, neutral: { bg: '#EEF2F7', color: '#64748B' } };\n      Object.assign(out, { rpVerdict: rp.verdict, rpExplanation: rp.explanation, rpIndicators: rp.indicators.map(i => ({ label: i.label, state: i.state, ...T[i.tone] })), rpTensionTitle: rp.tensionTitle, rpTensionText: rp.tensionText, rpHasTensionText: !!rp.tensionText, rpNextStep: rp.nextStep, rpTensionHeading: rp.tensionHeading, rpNextStepText: rp.nextStepText, rpHasNextStepText: !!rp.nextStepText });\n    }\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
